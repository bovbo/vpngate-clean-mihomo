name: Validate Workers and scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker JavaScript syntax
        run: |
          node --check "VPN Gate-worker.js"
          node --check "_worker - 副本.js"
          node --check "worker/worker.js"
      - name: Check Python syntax
        run: python -m compileall -q extras vps-relay
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find vps-relay -type f -name '*.sh' -print0)
      - name: Bundle Workers with Wrangler (dry run)
        run: |
          cp wrangler.sstp.toml.example .wrangler-ci-sstp.toml
          sed -i '/^\[\[kv_namespaces\]\]/,$d' .wrangler-ci-sstp.toml
          npx --yes wrangler@4 deploy --dry-run --config .wrangler-ci-sstp.toml
          (cd worker && npx --yes wrangler@4 deploy --dry-run --config wrangler.toml.example)
          rm -f .wrangler-ci-sstp.toml
